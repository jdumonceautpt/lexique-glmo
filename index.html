<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexique Interactif - SharePoint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3a3a3a 0%, #2d2d2d 100%);
            padding: 20px 25px;
            border-bottom: 2px solid #00d4ff;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 12px;
            color: #ffa500;
            font-weight: 600;
        }

        .search-container {
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 10px 15px;
            font-size: 0.9em;
            border: 1px solid #444;
            border-radius: 5px;
            background: #3a3a3a;
            color: #e0e0e0;
            outline: none;
            transition: all 0.2s;
        }

        #searchInput:focus {
            border-color: #00d4ff;
            background: #424242;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        #searchInput::placeholder {
            color: #888;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff;
            font-size: 1em;
        }

        .content {
            padding: 20px 25px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 12px;
            background: #3a3a3a;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffa500;
        }

        .stat-label {
            color: #999;
            font-size: 0.75em;
            margin-top: 2px;
        }

        #lexiqueList {
            display: grid;
            gap: 8px;
        }

        .lexique-item {
            display: grid;
            grid-template-columns: 280px 1fr 180px;
            gap: 20px;
            padding: 12px 15px;
            background: #3a3a3a;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
            transition: all 0.2s;
            align-items: start;
        }

        .lexique-item:hover {
            background: #424242;
            border-left-color: #00f0ff;
            transform: translateX(3px);
        }

        .terme {
            font-size: 0.95em;
            font-weight: 600;
            color: #00d4ff;
            line-height: 1.3;
        }

        .definition {
            color: #b0b0b0;
            line-height: 1.4;
            font-size: 0.85em;
        }

        .task-category {
            color: #888;
            font-size: 0.75em;
            margin-top: 3px;
            font-style: italic;
        }

        .estimated-effort {
            color: #00d4ff;
            line-height: 1.4;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .estimated-effort-label {
            color: #888;
            position: relative;
            cursor: help;
        }

        .estimated-effort-label::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #00d4ff;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            margin-bottom: 5px;
            border: 1px solid #00d4ff;
            z-index: 1000;
        }

        .estimated-effort-label:hover::after {
            opacity: 1;
        }

        .estimated-effort-value {
            background: #2d2d2d;
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid #444;
            color: #00d4ff;
            cursor: text;
            transition: all 0.2s;
            display: inline-block;
            min-width: 60px;
            flex: 0 1 auto;
        }

        .estimated-effort-value:hover {
            background: #3a3a3a;
            border-color: #00d4ff;
        }

        .estimated-effort-value:focus {
            outline: none;
            background: #424242;
            border-color: #00f0ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        /* Styles pour les familles de tâches */
        .family-section {
            margin-bottom: 25px;
        }

        /* Bouton retour en haut */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ffa500;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: #1a1a1a;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3);
            transition: all 0.3s;
            z-index: 999;
            display: none;
        }

        .back-to-top.visible {
            display: block;
        }

        .back-to-top:hover {
            background: #ffb733;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 165, 0, 0.4);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .no-results-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .highlight {
            background: #00d4ff;
            color: #1a1a1a;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.3em;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .lexique-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .terme {
                border-bottom: 2px solid #00d4ff;
                padding-bottom: 6px;
            }

            .estimated-effort {
                text-align: left;
                padding-top: 6px;
                border-top: 1px solid #444;
            }
        }

        /* Scrollbar styling pour le thème sombre */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }

        /* Modal de connexion */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .auth-overlay.hidden {
            display: none;
        }

        .auth-modal {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
            border: 1px solid #444;
            max-width: 320px;
            width: 90%;
        }

        .auth-modal h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-align: center;
            font-weight: 600;
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px;
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.95em;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .auth-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        .auth-button {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 4px;
            color: #1a1a1a;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-button:hover {
            background: #00f0ff;
        }

        .auth-error {
            color: #ff4444;
            font-size: 0.8em;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        .auth-error.visible {
            display: block;
        }

        .auth-readonly-link {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 8px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.8em;
            cursor: pointer;
            text-align: center;
            transition: color 0.2s;
        }

        .auth-readonly-link:hover {
            color: #00d4ff;
        }

        .access-mode {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3a3a3a;
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
            font-size: 0.85em;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .access-mode-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .access-mode-label {
            color: #888;
        }

        .access-mode-value {
            color: #00d4ff;
            font-weight: 600;
        }

        .access-mode-value.readonly {
            color: #ffa500;
        }

        .access-mode-value.partial {
            color: #ffcc00;
        }

        .access-mode-value.full-write {
            color: #00d4ff;
        }

        .switch-mode-btn,
        .export-btn {
            background: #444;
            border: 1px solid #555;
            color: #ffa500;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-mode-btn:hover,
        .export-btn:hover {
            background: #555;
            border-color: #ffa500;
        }

        /* Bouton d'export */
        .export-container {
            position: relative;
        }

        .export-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1001;
            min-width: 120px;
        }

        .export-menu.visible {
            display: block;
        }

        .export-option {
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
            color: #e0e0e0;
            font-size: 0.85em;
        }

        .export-option:hover {
            background: #3a3a3a;
            color: #00d4ff;
        }

        .export-option:first-child {
            border-radius: 4px 4px 0 0;
        }

        .export-option:last-child {
            border-radius: 0 0 4px 4px;
        }
    </style>
</head>
<body>
    <!-- Modal de connexion -->
    <div class="auth-overlay hidden" id="authOverlay">
        <div class="auth-modal">
            <h2>🔒 Connexion</h2>
            <input 
                type="password" 
                id="passwordInput" 
                class="auth-input" 
                placeholder="Mot de passe"
                autofocus
            >
            <button class="auth-button" onclick="authenticate()">Valider</button>
            <div class="auth-error" id="authError">Mot de passe incorrect</div>
            <button class="auth-readonly-link" onclick="goReadOnly()">← Revenir en lecture seule</button>
        </div>
    </div>

    <!-- Indicateur du mode d'accès -->
    <div class="access-mode" id="accessMode" style="display: none;">
        <div class="access-mode-info">
            <span class="access-mode-label">Mode :</span>
            <span class="access-mode-value" id="accessModeValue">Lecture seule</span>
        </div>
        <button class="switch-mode-btn" onclick="switchMode()">Changer</button>
        <button class="switch-mode-btn" onclick="toggleLanguage()" id="langValue">🇫🇷 FR</button>
        <div class="export-container">
            <button class="export-btn" onclick="toggleExportMenu()">📥 Exporter</button>
            <div class="export-menu" id="exportMenu">
                <div class="export-option" onclick="exportToExcel()">📊 Excel (.xlsx)</div>
                <div class="export-option" onclick="exportToCSV()">📄 CSV (.csv)</div>
            </div>
        </div>
    </div>

    <!-- Bouton retour en haut -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="Retour en haut">↑</button>

    <div class="container">
        <div class="header">
            <h1>📋 Lexique des tâches Media Orders</h1>
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Rechercher un terme..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalTerms">0</div>
                    <div class="stat-label">Termes au total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="displayedTerms">0</div>
                    <div class="stat-label">Termes affichés</div>
                </div>
            </div>

            <div id="lexiqueList"></div>
        </div>
    </div>

    <!-- Bibliothèque pour l'export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase désactivé : voir lexique-glmo-custom-tasks-backup.html pour le réactiver -->

    <script>
        // ========================================
        // SYSTÈME D'AUTHENTIFICATION
        // ========================================
        
        let accessMode = null; // 'readonly', 'partial_write' ou 'full_write'
        
        // Mots de passe (À MODIFIER en production !)
        // La lecture seule n'a plus de mot de passe : c'est le mode par défaut au chargement
        const PASSWORD_PARTIAL_WRITE = '456';  // Édition temps estimés uniquement
        const PASSWORD_FULL_WRITE = '789';     // Édition complète
        
        // Active un mode d'accès donné et met à jour l'UI + les données affichées
        function activateMode(mode) {
            const accessModeDiv = document.getElementById('accessMode');
            const accessModeValue = document.getElementById('accessModeValue');
            const previousMode = accessMode;
            const currentSearch = document.getElementById('searchInput').value;
            
            const labels = {
                readonly: 'Lecture seule',
                partial_write: 'Écriture partielle',
                full_write: 'Écriture complète'
            };
            const cssClasses = {
                readonly: 'readonly',
                partial_write: 'partial',
                full_write: 'full-write'
            };
            
            accessMode = mode;
            accessModeValue.textContent = labels[mode];
            accessModeValue.classList.remove('readonly', 'partial', 'full-write');
            accessModeValue.classList.add(cssClasses[mode]);
            accessModeDiv.style.display = 'flex';
            
            if (previousMode !== null && previousMode !== mode) {
                if (currentSearch) {
                    searchLexique(currentSearch);
                } else {
                    displayLexique();
                }
            } else {
                initializeLexique();
            }
        }
        
        function authenticate() {
            const password = document.getElementById('passwordInput').value;
            const authError = document.getElementById('authError');
            const authOverlay = document.getElementById('authOverlay');
            
            if (password === PASSWORD_FULL_WRITE) {
                authOverlay.classList.add('hidden');
                activateMode('full_write');
            } else if (password === PASSWORD_PARTIAL_WRITE) {
                authOverlay.classList.add('hidden');
                activateMode('partial_write');
            } else {
                // Mot de passe incorrect
                authError.classList.add('visible');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
                
                // Masquer l'erreur après 3 secondes
                setTimeout(() => {
                    authError.classList.remove('visible');
                }, 3000);
            }
        }
        
        // Revenir en lecture seule (aucun mot de passe requis)
        function goReadOnly() {
            document.getElementById('authOverlay').classList.add('hidden');
            activateMode('readonly');
        }
        
        // Fonction pour changer de mode d'accès (ouvre la saisie du mot de passe)
        function switchMode() {
            const authOverlay = document.getElementById('authOverlay');
            const passwordInput = document.getElementById('passwordInput');
            const authError = document.getElementById('authError');
            
            // Réinitialiser la modal
            passwordInput.value = '';
            authError.classList.remove('visible');
            
            // Afficher la modal
            authOverlay.classList.remove('hidden');
            passwordInput.focus();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Permettre la connexion avec la touche Enter
            document.getElementById('passwordInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    authenticate();
                }
            });
            
            // Démarrage direct en lecture seule : aucun mot de passe requis
            goReadOnly();
        });
        
        async function initializeLexique() {
            // Tâches personnalisées / Firebase désactivées pour l'instant
            // → voir lexique-glmo-custom-tasks-backup.html pour réactiver
            
            // Charger la préférence de langue depuis localStorage
            loadLanguagePreference();
            
            // Mettre à jour le bouton langue
            const langBtn = document.getElementById('langValue');
            if (langBtn) {
                langBtn.textContent = showFrenchDescription ? '🇫🇷 FR' : '🇬🇧 EN';
            }
            
            displayLexique();
            updateStats(nativeTasksData.length, nativeTasksData.length);
            
            // Initialiser la recherche en temps réel (une seule fois)
            if (!window.searchInitialized) {
                document.getElementById('searchInput').addEventListener('input', function(e) {
                    searchLexique(e.target.value);
                });
                window.searchInitialized = true;
            }
        }

        // ========================================
        // DONNÉES DU LEXIQUE - MODIFIEZ ICI
        // ========================================
        // Pour mettre à jour le lexique :
        // 1. Utilisez le convertisseur Excel vers JSON
        // 2. Copiez le code généré
        // 3. Remplacez la variable nativeTasksData ci-dessous

        // Fonction pour afficher le lexique avec les deux familles
        function displayLexique(nativeFiltered = null, customFiltered = null) {
            const container = document.getElementById('lexiqueList');
            
            // Déterminer les permissions selon le mode
            const canEditEstimatedEffort = (accessMode === 'partial_write' || accessMode === 'full_write');
            
            // Utiliser les données filtrées ou toutes les données
            const nativeData = nativeFiltered || nativeTasksData;
            
            const tooltipText = "Format : minutes (ex: 45) ou RT (ex: 2*RT)";
            
            container.innerHTML = createNativeTasksSection(nativeData, canEditEstimatedEffort, tooltipText);

        // Fonction pour créer la section des tâches natives
        function createNativeTasksSection(nativeData, canEditEffort, tooltipText) {
            let html = `
                <div class="family-section">
                    <div id="nativeTasksList">
            `;
            
            if (nativeData.length === 0) {
                html += `<div class="no-results"><p>Aucune tâche native trouvée</p></div>`;
            } else {
                nativeData.forEach((item, index) => {
                    const actualIndex = item.originalIndex !== undefined ? item.originalIndex : index;
                    const description = showFrenchDescription ? item.Description_FR : item.Description;
                    html += `
                        <div class="lexique-item">
                            <div class="terme">
                                ${item.Name}
                                <div class="task-category">${item.cost_category}</div>
                            </div>
                            <div class="definition">${description}</div>
                            <div class="estimated-effort">
                                <span class="estimated-effort-label" data-tooltip="${tooltipText}">Temps estimé :</span>
                                <span class="estimated-effort-value" 
                                      contenteditable="${canEditEffort}" 
                                      data-family="native"
                                      data-index="${actualIndex}"
                                      spellcheck="false"
                                      style="${!canEditEffort ? 'cursor: not-allowed; opacity: 0.7;' : 'cursor: text;'}"
                                      onblur="${canEditEffort ? `saveEstimatedEffort('native', ${actualIndex}, this.textContent)` : ''}"
                                      onkeydown="${canEditEffort ? `if(event.key==='Enter'){event.preventDefault();this.blur();}` : 'event.preventDefault();'}">${item.estimated_effort || '—'}</span>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += `
                    </div>
                </div>
            `;
            
            return html;
        }

        // Fonction pour sauvegarder les modifications du temps estimé
        function saveEstimatedEffort(family, index, newValue) {
            if (index >= 0 && index < nativeTasksData.length) {
                nativeTasksData[index].estimated_effort = newValue.trim();
                console.log(`Temps estimé mis à jour pour "${nativeTasksData[index].Name}": ${newValue}`);

        // Fonction de recherche avec surlignage
        // Échapper les caractères spéciaux regex dans le terme recherché
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function searchLexique(query) {
            const searchTerm = query.toLowerCase().trim();
            
            // Afficher toute la liste pour 0 ou 1 caractère
            if (searchTerm.length <= 1) {
                displayLexique();
                updateStats(nativeTasksData.length, nativeTasksData.length);
                return;
            }
            
            // Liste des acronymes de 2 lettres à traiter en "mot exact" uniquement
            const exceptionList = ['io', 'tt', 'au', 'av', 'gl'];
            
            // Vérifier si le terme tapé est un acronyme d'exception
            const isExactMatch = exceptionList.includes(searchTerm);
            
            const escapedTerm = escapeRegExp(searchTerm);
            
            // Construction du pattern :
            // - Exception (ex: "au") : mot exact entier -> \b(au)\b
            // - Sinon : début de mot (préfixe) -> \b(aud...)
            const patternStr = isExactMatch ? `\\b(${escapedTerm})\\b` : `\\b(${escapedTerm})`;
            
            // Fonction de test : cherche dans le Nom ET dans la Description affichée
            function itemMatches(item) {
                const description = showFrenchDescription ? item.Description_FR : item.Description;
                const regex = new RegExp(patternStr, 'i');
                return regex.test(item.Name) || regex.test(description || '');
            }
            
            // Filtrer les tâches natives (recherche sur Nom + Description)
            const nativeFilteredWithIndex = nativeTasksData
                .map((item, index) => ({ ...item, originalIndex: index }))
                .filter(itemMatches);

            // Créer une version avec surlignage sur le Nom ET sur la Description affichée
            const descriptionField = showFrenchDescription ? 'Description_FR' : 'Description';
            const nativeHighlighted = nativeFilteredWithIndex.map(item => ({
                ...item,
                Name: highlightText(item.Name, patternStr),
                [descriptionField]: highlightText(item[descriptionField], patternStr)
            }));

            displayLexique(nativeHighlighted);
            
            updateStats(nativeTasksData.length, nativeHighlighted.length);
        }

        // Fonction pour surligner le texte à partir d'un pattern regex déjà construit
        function highlightText(text, patternStr) {
            if (!text) return text;
            const regex = new RegExp(patternStr, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

            nativeTasksData.forEach(task => {
                allTasks.push({
                    'Famille': 'Tâches natives GLMO',
                    'Nom': task.Name,

                    'Description (FR)': task.Description_FR,
                    'Catégorie de coût': task.cost_category,

            });
            
            return allTasks;
        }
        
        // Export en Excel
        function exportToExcel() {
            console.log('Export Excel demandé');
            
            // Fermer le menu
            document.getElementById('exportMenu').classList.remove('visible');
            
            const data = prepareExportData();
            
            // Créer une feuille de calcul
            const ws = XLSX.utils.json_to_sheet(data);
            
            // Ajuster la largeur des colonnes
            const colWidths = [
                { wch: 25 }, // Famille
                { wch: 30 }, // Nom
                { wch: 50 }, // Description EN
                { wch: 50 }, // Description FR
                { wch: 20 }, // Catégorie
                { wch: 15 }  // Effort
            ];
            ws['!cols'] = colWidths;
            
            // Créer un classeur
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Tâches Media Orders');
            
            // Générer le nom du fichier avec la date
            const date = new Date().toISOString().split('T')[0];
            const filename = `Lexique_Taches_Media_Orders_${date}.xlsx`;
            
            // Télécharger le fichier
            XLSX.writeFile(wb, filename);
            console.log('Export Excel terminé:', filename);
        }
        
        // Export en CSV
        function exportToCSV() {
            console.log('Export CSV demandé');
            
            // Fermer le menu
            document.getElementById('exportMenu').classList.remove('visible');
            
            const data = prepareExportData();
            
            // Créer le contenu CSV
            const headers = ['Famille', 'Nom', 'Description (EN)', 'Description (FR)', 'Catégorie de coût', 'Effort estimé'];
            let csvContent = headers.join(';') + '\n';
            
            data.forEach(row => {
                const values = [
                    row['Famille'],
                    row['Nom'],
                    row['Description (EN)'],
                    row['Description (FR)'],
                    row['Catégorie de coût'],
                    row['Effort estimé']
                ];
                
                // Échapper les guillemets et entourer les valeurs de guillemets si nécessaire
                const escapedValues = values.map(val => {
                    if (val === null || val === undefined) return '';
                    const str = String(val);
                    if (str.includes(';') || str.includes('"') || str.includes('\n')) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                });
                
                csvContent += escapedValues.join(';') + '\n';
            });
            
            // Créer un blob et télécharger
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const date = new Date().toISOString().split('T')[0];
            const filename = `Lexique_Taches_Media_Orders_${date}.csv`;
            
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            console.log('Export CSV terminé:', filename);
        }
    </script>
</body>
</html>
