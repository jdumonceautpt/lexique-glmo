<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexique Interactif - SharePoint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3a3a3a 0%, #2d2d2d 100%);
            padding: 20px 25px;
            border-bottom: 2px solid #00d4ff;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 12px;
            color: #ffa500;
            font-weight: 600;
        }

        .search-container {
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 10px 15px;
            font-size: 0.9em;
            border: 1px solid #444;
            border-radius: 5px;
            background: #3a3a3a;
            color: #e0e0e0;
            outline: none;
            transition: all 0.2s;
        }

        #searchInput:focus {
            border-color: #00d4ff;
            background: #424242;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        #searchInput::placeholder {
            color: #888;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff;
            font-size: 1em;
        }

        .content {
            padding: 20px 25px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 12px;
            background: #3a3a3a;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffa500;
        }

        .stat-label {
            color: #999;
            font-size: 0.75em;
            margin-top: 2px;
        }

        #lexiqueList {
            display: grid;
            gap: 8px;
        }

        .lexique-item {
            display: grid;
            grid-template-columns: 280px 1fr 180px;
            gap: 20px;
            padding: 12px 15px;
            background: #3a3a3a;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
            transition: all 0.2s;
            align-items: start;
        }

        .lexique-item:hover {
            background: #424242;
            border-left-color: #00f0ff;
            transform: translateX(3px);
        }

        .terme {
            font-size: 0.95em;
            font-weight: 600;
            color: #00d4ff;
            line-height: 1.3;
        }

        .definition {
            color: #b0b0b0;
            line-height: 1.4;
            font-size: 0.85em;
        }

        .task-category {
            color: #888;
            font-size: 0.75em;
            margin-top: 3px;
            font-style: italic;
        }

        .task-source {
            color: #999;
            font-size: 0.75em;
            margin-top: 5px;
            font-style: italic;
        }

        .task-source-label {
            color: #666;
        }

        .estimated-effort {
            color: #00d4ff;
            line-height: 1.4;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .estimated-effort-label {
            color: #888;
            position: relative;
            cursor: help;
        }

        .estimated-effort-label::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #00d4ff;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            margin-bottom: 5px;
            border: 1px solid #00d4ff;
            z-index: 1000;
        }

        .estimated-effort-label:hover::after {
            opacity: 1;
        }

        /* Tooltip rose pour les tâches personnalisées */
        .lexique-item.custom .estimated-effort-label::after {
            color: #ff6b9d;
            border-color: #ff6b9d;
        }

        .estimated-effort-value {
            background: #2d2d2d;
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid #444;
            color: #00d4ff;
            cursor: text;
            transition: all 0.2s;
            display: inline-block;
            min-width: 60px;
            flex: 0 1 auto;
        }

        .estimated-effort-value:hover {
            background: #3a3a3a;
            border-color: #00d4ff;
        }

        .estimated-effort-value:focus {
            outline: none;
            background: #424242;
            border-color: #00f0ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        /* Styles pour les familles de tâches */
        .family-section {
            margin-bottom: 25px;
        }

        .family-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #3a3a3a;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #00d4ff;
        }

        .family-title {
            color: #e0e0e0;
            font-size: 1em;
            font-weight: 600;
        }

        .order-btn {
            background: transparent;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0 8px 0 0;
            color: #00d4ff;
        }

        .order-btn:hover {
            transform: scale(1.2);
        }

        .family-count {
            color: #888;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .add-task-btn {
            background: #ff6b9d;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            color: #1a1a1a;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-task-btn:hover {
            background: #ff85ad;
            transform: translateY(-1px);
        }

        /* Tâches personnalisées en rose */
        .lexique-item.custom {
            border-left-color: #ff6b9d;
        }

        .lexique-item.custom .terme {
            color: #ff6b9d;
        }

        .lexique-item.custom .estimated-effort-value {
            color: #ff6b9d;
            border-color: #ff6b9d;
        }

        .lexique-item.custom .estimated-effort-value:hover {
            border-color: #ff85ad;
        }

        .lexique-item.custom .estimated-effort-value:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 2px rgba(255, 107, 157, 0.1);
        }

        /* Boutons d'action pour les tâches personnalisées */
        .task-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: auto;
        }

        .action-btn {
            background: #444;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
        }

        .action-btn.edit:hover {
            background: #ff6b9d;
            border-color: #ff6b9d;
            color: #1a1a1a;
        }

        .action-btn.delete:hover {
            background: #ff4444;
            border-color: #ff4444;
            color: white;
        }

        /* Modal d'ajout/édition de tâche */
        .task-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .task-modal-overlay.hidden {
            display: none;
        }

        .task-modal {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 8px;
            border: 2px solid #ff6b9d;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .task-modal h3 {
            color: #ff6b9d;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            color: #888;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.9em;
            outline: none;
            transition: all 0.2s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 2px rgba(255, 107, 157, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.save {
            background: #ff6b9d;
            color: #1a1a1a;
        }

        .modal-btn.save:hover {
            background: #ff85ad;
        }

        .modal-btn.cancel {
            background: #444;
            color: #e0e0e0;
        }

        .modal-btn.cancel:hover {
            background: #555;
        }

        /* Modal de confirmation de suppression */
        .confirm-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .confirm-modal-overlay.hidden {
            display: none;
        }

        .confirm-modal {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 8px;
            border: 2px solid #ff4444;
            max-width: 400px;
            width: 90%;
        }

        .confirm-modal h3 {
            color: #ff4444;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .confirm-modal p {
            color: #e0e0e0;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .confirm-buttons {
            display: flex;
            gap: 10px;
        }

        .confirm-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirm-btn.delete-confirm {
            background: #ff4444;
            color: white;
        }

        .confirm-btn.delete-confirm:hover {
            background: #ff6666;
        }

        .confirm-btn.delete-cancel {
            background: #444;
            color: #e0e0e0;
        }

        .confirm-btn.delete-cancel:hover {
            background: #555;
        }

        /* Bouton retour en haut */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ffa500;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: #1a1a1a;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3);
            transition: all 0.3s;
            z-index: 999;
            display: none;
        }

        .back-to-top.visible {
            display: block;
        }

        .back-to-top:hover {
            background: #ffb733;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 165, 0, 0.4);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .no-results-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .highlight {
            background: #00d4ff;
            color: #1a1a1a;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.3em;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .lexique-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .terme {
                border-bottom: 2px solid #00d4ff;
                padding-bottom: 6px;
            }

            .estimated-effort {
                text-align: left;
                padding-top: 6px;
                border-top: 1px solid #444;
            }
        }

        /* Scrollbar styling pour le thème sombre */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }

        /* Modal de connexion */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .auth-overlay.hidden {
            display: none;
        }

        .auth-modal {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
            border: 1px solid #444;
            max-width: 320px;
            width: 90%;
        }

        .auth-modal h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-align: center;
            font-weight: 600;
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px;
            background: #3a3a3a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.95em;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .auth-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        .auth-button {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 4px;
            color: #1a1a1a;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-button:hover {
            background: #00f0ff;
        }

        .auth-error {
            color: #ff4444;
            font-size: 0.8em;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        .auth-error.visible {
            display: block;
        }

        .access-mode {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3a3a3a;
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
            font-size: 0.85em;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .access-mode-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .access-mode-label {
            color: #888;
        }

        .access-mode-value {
            color: #00d4ff;
            font-weight: 600;
        }

        .access-mode-value.readonly {
            color: #ffa500;
        }

        .access-mode-value.partial {
            color: #ffcc00;
        }

        .access-mode-value.full-write {
            color: #00d4ff;
        }

        .switch-mode-btn {
            background: #444;
            border: 1px solid #555;
            color: #ffa500;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-mode-btn:hover {
            background: #555;
            border-color: #ffa500;
        }

        /* Bouton d'export */
        .export-container {
            position: relative;
        }

        .export-btn {
            background: #444;
            border: 1px solid #555;
            color: #ffa500;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .export-btn:hover {
            background: #555;
            border-color: #ffa500;
        }

        .export-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1001;
            min-width: 120px;
        }

        .export-menu.visible {
            display: block;
        }

        .export-option {
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
            color: #e0e0e0;
            font-size: 0.85em;
        }

        .export-option:hover {
            background: #3a3a3a;
            color: #00d4ff;
        }

        .export-option:first-child {
            border-radius: 4px 4px 0 0;
        }

        .export-option:last-child {
            border-radius: 0 0 4px 4px;
        }
    </style>
</head>
<body>
    <!-- Modal de connexion -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <h2>🔒 Connexion</h2>
            <input 
                type="password" 
                id="passwordInput" 
                class="auth-input" 
                placeholder="Mot de passe"
                autofocus
            >
            <button class="auth-button" onclick="authenticate()">Valider</button>
            <div class="auth-error" id="authError">Mot de passe incorrect</div>
        </div>
    </div>

    <!-- Indicateur du mode d'accès -->
    <div class="access-mode" id="accessMode" style="display: none;">
        <div class="access-mode-info">
            <span class="access-mode-label">Mode :</span>
            <span class="access-mode-value" id="accessModeValue">Lecture seule</span>
        </div>
        <button class="switch-mode-btn" onclick="switchMode()">Changer</button>
        <button class="switch-mode-btn" onclick="toggleLanguage()" id="langValue">🇫🇷 FR</button>
        <div class="export-container">
            <button class="export-btn" onclick="toggleExportMenu()">📥 Exporter</button>
            <div class="export-menu" id="exportMenu">
                <div class="export-option" onclick="exportToExcel()">📊 Excel (.xlsx)</div>
                <div class="export-option" onclick="exportToCSV()">📄 CSV (.csv)</div>
            </div>
        </div>
    </div>

    <!-- Modal d'ajout/édition de tâche -->
    <div class="task-modal-overlay hidden" id="taskModalOverlay">
        <div class="task-modal">
            <h3 id="taskModalTitle">➕ Ajouter une tâche</h3>
            <div id="taskForm">
                <div class="form-group">
                    <label class="form-label">Nom de la tâche *</label>
                    <input type="text" class="form-input" id="taskName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Tâche d'origine (optionnel)</label>
                    <select class="form-select" id="taskSourceTask">
                        <option value="">-- Aucune --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description (EN) *</label>
                    <textarea class="form-textarea" id="taskDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Description (FR) *</label>
                    <textarea class="form-textarea" id="taskDescriptionFR" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Catégorie de coût *</label>
                    <select class="form-select" id="taskCostCategory" required>
                        <option value="">-- Sélectionner --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Effort estimé * (ex: 2*RT ou 45)</label>
                    <input type="text" class="form-input" id="taskEstimatedEffort" placeholder="ex: 2*RT ou 45" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn cancel" onclick="closeTaskModal()">Annuler</button>
                    <button type="button" class="modal-btn save" onclick="saveTask()">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmation de suppression -->
    <div class="confirm-modal-overlay hidden" id="confirmModalOverlay">
        <div class="confirm-modal">
            <h3>⚠️ Confirmer la suppression</h3>
            <p id="confirmMessage">Êtes-vous sûr de vouloir supprimer cette tâche ?</p>
            <div class="confirm-buttons">
                <button class="confirm-btn delete-cancel" onclick="cancelDelete()">Annuler</button>
                <button class="confirm-btn delete-confirm" onclick="confirmDelete()">Supprimer</button>
            </div>
        </div>
    </div>

    <!-- Bouton retour en haut -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="Retour en haut">↑</button>

    <div class="container">
        <div class="header">
            <h1>📋 Lexique des tâches Media Orders</h1>
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Rechercher un terme..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalTerms">0</div>
                    <div class="stat-label">Termes au total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="displayedTerms">0</div>
                    <div class="stat-label">Termes affichés</div>
                </div>
            </div>

            <div id="lexiqueList"></div>
        </div>
    </div>

        const CUSTOM_TASKS_ENABLED = false;
        const PASSWORD_PARTIAL_WRITE = '456';  // Nouveau : édition temps estimés uniquement
        const PASSWORD_FULL_WRITE = '789';     // Nouveau : édition complète
        
        function authenticate() {
            const password = document.getElementById('passwordInput').value;
            const authError = document.getElementById('authError');
            const authOverlay = document.getElementById('authOverlay');
            const accessModeDiv = document.getElementById('accessMode');
            const accessModeValue = document.getElementById('accessModeValue');
            
            const previousMode = accessMode;
            const currentSearch = document.getElementById('searchInput').value;
            
            if (password === PASSWORD_FULL_WRITE) {
                // Accès en écriture complète (789)
                accessMode = 'full_write';
                accessModeValue.textContent = 'Écriture complète';
                accessModeValue.classList.remove('readonly', 'partial');
                accessModeValue.classList.add('full-write');
                authOverlay.classList.add('hidden');
                accessModeDiv.style.display = 'flex';
                
                if (previousMode !== null && previousMode !== 'full_write') {
                    if (currentSearch) {
                        searchLexique(currentSearch);
                    } else {
                        displayLexique();
                    }
                } else {
                    initializeLexique();
                }
            } else if (password === PASSWORD_PARTIAL_WRITE) {
                // Accès en écriture partielle (456) - uniquement temps estimés
                accessMode = 'partial_write';
                accessModeValue.textContent = 'Écriture partielle';
                accessModeValue.classList.remove('readonly', 'full-write');
                accessModeValue.classList.add('partial');
                authOverlay.classList.add('hidden');
                accessModeDiv.style.display = 'flex';
                
                if (previousMode !== null && previousMode !== 'partial_write') {
                    if (currentSearch) {
                        searchLexique(currentSearch);
                    } else {
                        displayLexique();
                    }
                } else {
                    initializeLexique();
                }
            } else if (password === PASSWORD_READONLY) {
                // Accès en lecture seule (123)
                accessMode = 'readonly';
                accessModeValue.textContent = 'Lecture seule';
                accessModeValue.classList.remove('partial', 'full-write');
                accessModeValue.classList.add('readonly');
                authOverlay.classList.add('hidden');
                accessModeDiv.style.display = 'flex';
                
                if (previousMode !== null && previousMode !== 'readonly') {
                    if (currentSearch) {
                        searchLexique(currentSearch);
                    } else {
                        displayLexique();
                    }
                } else {
                    initializeLexique();
                }
            } else {
                // Mot de passe incorrect
                authError.classList.add('visible');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
                
                // Masquer l'erreur après 3 secondes
                setTimeout(() => {
                    authError.classList.remove('visible');
                }, 3000);
            }
        }
        
        // Fonction pour changer de mode d'accès

            const authOverlay = document.getElementById('authOverlay');

            // Réinitialiser la modal
            passwordInput.value = '';
            authError.classList.remove('visible');
            
            // Afficher la modal
            authOverlay.classList.remove('hidden');
            passwordInput.focus();
        }

        async function loadCustomTasks() {
            try {
                const tasksRef = window.firestoreCollection(window.firestoreDB, 'customTasks');
                const querySnapshot = await window.firestoreGetDocs(tasksRef);
                
                customTasksData = [];
                querySnapshot.forEach((doc) => {
                    customTasksData.push(doc.data());
                });
                
                console.log('✅ Tâches chargées depuis Firebase:', customTasksData.length);
                
                // Écouter les changements en temps réel
                setupRealtimeSync();

                customTasksData = [];
            }
        }
        
        // Synchronisation en temps réel
        function setupRealtimeSync() {
            const tasksRef = window.firestoreCollection(window.firestoreDB, 'customTasks');
            
            window.firestoreOnSnapshot(tasksRef, (snapshot) => {
                console.log('🔄 Synchronisation en cours...');
                customTasksData = [];
                snapshot.forEach((doc) => {
                    customTasksData.push(doc.data());
                });
                
                // Rafraîchir l'affichage si on est déjà connecté
                if (accessMode !== null) {
                    const currentSearch = document.getElementById('searchInput').value;
                    if (currentSearch) {
                        searchLexique(currentSearch);
                    } else {
                        displayLexique();
                    }
                    updateStats(nativeTasksData.length + customTasksData.length, nativeTasksData.length + customTasksData.length);
                }
            });
        }

        async function saveCustomTasks() {

                const savePromises = [];

                    const taskRef = window.firestoreDoc(window.firestoreDB, 'customTasks', `task_${i}`);
                    savePromises.push(window.firestoreSetDoc(taskRef, customTasksData[i]));
                }
                await Promise.all(savePromises);
                
                console.log('✅ Tâches sauvegardées sur Firebase');

                console.error('❌ Erreur lors de la sauvegarde sur Firebase:', e);
            }

            const sourceTask = nativeTasksData.find(task => task.Name === sourceName);

        // Sauvegarder la tâche (ajout ou modification)
        function saveTask() {
            // Validation basique
            const name = document.getElementById('taskName').value.trim();
            const description = document.getElementById('taskDescription').value.trim();
            const descriptionFR = document.getElementById('taskDescriptionFR').value.trim();
            const costCategory = document.getElementById('taskCostCategory').value;
            const estimatedEffort = document.getElementById('taskEstimatedEffort').value.trim();
            const sourceTask = document.getElementById('taskSourceTask').value;
            
            if (!name || !description || !descriptionFR || !costCategory || !estimatedEffort) {
                alert('Veuillez remplir tous les champs obligatoires');
                return;
            }
            
            const task = {
                Name: name,
                Description: description,
                Description_FR: descriptionFR,
                cost_category: costCategory,
                estimated_effort: estimatedEffort,
                sourceTask: sourceTask
            };
            
            if (editingTaskIndex !== null) {
                // Modification
                customTasksData[editingTaskIndex] = task;
            } else {
                // Ajout
                customTasksData.push(task);
            }
            
            saveCustomTasks();
            closeTaskModal();
            
            // Rafraîchir l'affichage
            const currentSearch = document.getElementById('searchInput').value;
            if (currentSearch) {
                searchLexique(currentSearch);
            } else {
                displayLexique();
            }

        // Confirmer la suppression
        async function confirmDelete() {
            if (deletingTaskIndex !== null) {
                const deletedTask = customTasksData[deletingTaskIndex];
                console.log('Suppression confirmée pour:', deletedTask);
                
                try {
                    // 1. Compter combien de tâches on avait avant
                    const oldLength = customTasksData.length;
                    
                    // 2. Retirer du tableau local
                    customTasksData.splice(deletingTaskIndex, 1);
                    const newLength = customTasksData.length;
                    
                    // 3. Re-numéroter tous les documents restants
                    const savePromises = [];
                    for (let i = 0; i < newLength; i++) {
                        const taskRef = window.firestoreDoc(window.firestoreDB, 'customTasks', `task_${i}`);
                        savePromises.push(window.firestoreSetDoc(taskRef, customTasksData[i]));
                    }
                    
                    // 4. Supprimer les documents orphelins (anciens index qui n'existent plus)
                    for (let i = newLength; i < oldLength; i++) {
                        const docRef = window.firestoreDoc(window.firestoreDB, 'customTasks', `task_${i}`);
                        savePromises.push(window.firestoreDeleteDoc(docRef));
                    }
                    
                    await Promise.all(savePromises);
                    
                    console.log('✅ Tâche supprimée avec succès');
                } catch (e) {
                    console.error('❌ Erreur lors de la suppression:', e);
                }
                
                // Fermer la modal
                document.getElementById('confirmModalOverlay').classList.add('hidden');
                deletingTaskIndex = null;
                
                // Rafraîchir l'affichage
                const currentSearch = document.getElementById('searchInput').value;
                if (currentSearch) {
                    searchLexique(currentSearch);
                } else {
                    displayLexique();
                }
            }
        }

        // Fonction de recherche avec surlignage
        function searchLexique(query) {
            if (!query) {
                displayLexique();
                updateStats(nativeTasksData.length, nativeTasksData.length);
                return;
            }

            const searchTerm = query.toLowerCase();
            
            // Liste des préfixes spéciaux qui déclenchent une recherche par début de ligne
            const specialPrefixes = ['io', 'tt', 'au', 'av', 'gl'];
            
            // Vérifier si c'est un filtre spécial (recherche exacte sur ces codes)
            const isSpecialFilter = specialPrefixes.includes(searchTerm);
            
            // Fonction de filtrage selon le mode
            let filterFunction;
            if (isSpecialFilter) {
                // Mode filtre spécial : chercher uniquement les tâches qui COMMENCENT par ce préfixe
                const prefix = searchTerm.toUpperCase();
                filterFunction = (item) => item.Name.toUpperCase().startsWith(prefix);
            } else {
                // Mode recherche normale : chercher partout dans le nom
                filterFunction = (item) => item.Name.toLowerCase().includes(searchTerm);
            }
            
            // Filtrer les tâches natives
            const nativeFilteredWithIndex = nativeTasksData
                .map((item, index) => ({ ...item, originalIndex: index }))
                .filter(filterFunction);

            // Créer une version avec surlignage uniquement sur Name
            const nativeHighlighted = nativeFilteredWithIndex.map(item => ({
                ...item,
                Name: highlightText(item.Name, isSpecialFilter ? searchTerm.toUpperCase() : searchTerm)
            }));

            displayLexique(nativeHighlighted);
            
            updateStats(nativeTasksData.length, nativeHighlighted.length);
        }

        // Fonction pour surligner le texte
        function highlightText(text, search) {
            const regex = new RegExp(`(${search})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Fonction pour mettre à jour les statistiques
        function updateStats(total, displayed) {
            document.getElementById('totalTerms').textContent = total;
            document.getElementById('displayedTerms').textContent = displayed;
        }
        
        // Fonction pour retourner en haut de la page
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
        
        // Afficher/masquer le bouton retour en haut en fonction du scroll
        window.addEventListener('scroll', function() {
            const backToTopBtn = document.getElementById('backToTop');
            if (window.pageYOffset > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });
        
        // ========================================
        // FONCTIONS D'EXPORT
        // ========================================
        
        // Toggle menu d'export
        function toggleExportMenu() {
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('visible');
        }
        
        // Fermer le menu d'export si on clique ailleurs
        document.addEventListener('click', function(event) {
            const exportContainer = document.querySelector('.export-container');
            const exportMenu = document.getElementById('exportMenu');
            if (exportContainer && !exportContainer.contains(event.target)) {
                exportMenu.classList.remove('visible');
            }
        });
        
        // Préparer les données pour l'export (toutes les tâches)
        function prepareExportData() {
            const allTasks = [];
            
            // Ajouter les tâches natives
            nativeTasksData.forEach(task => {
                allTasks.push({
                    'Famille': 'Tâches natives GLMO',
                    'Nom': task.Name,
                    'Description (EN)': task.Description,
                    'Description (FR)': task.Description_FR,
                    'Catégorie de coût': task.cost_category,
                    'Effort estimé': task.estimated_effort
                });
            });
            
            // Ajouter les tâches personnalisées
            customTasksData.forEach(task => {
                allTasks.push({
                    'Famille': 'Tâches personnalisées',
                    'Nom': task.Name,
                    'Description (EN)': task.Description,
                    'Description (FR)': task.Description_FR,
                    'Catégorie de coût': task.cost_category,
                    'Effort estimé': task.estimated_effort
                });
            });
            
            return allTasks;
        }
        
        // Export en Excel
        function exportToExcel() {
            console.log('Export Excel demandé');
            
            // Fermer le menu
            document.getElementById('exportMenu').classList.remove('visible');
            
            const data = prepareExportData();
            
            // Créer une feuille de calcul
            const ws = XLSX.utils.json_to_sheet(data);
            
            // Ajuster la largeur des colonnes
            const colWidths = [
                { wch: 25 }, // Famille
                { wch: 30 }, // Nom
                { wch: 50 }, // Description EN
                { wch: 50 }, // Description FR
                { wch: 20 }, // Catégorie
                { wch: 15 }  // Effort
            ];
            ws['!cols'] = colWidths;
            
            // Créer un classeur
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Tâches Media Orders');
            
            // Générer le nom du fichier avec la date
            const date = new Date().toISOString().split('T')[0];
            const filename = `Lexique_Taches_Media_Orders_${date}.xlsx`;
            
            // Télécharger le fichier
            XLSX.writeFile(wb, filename);
            console.log('Export Excel terminé:', filename);
        }
        
        // Export en CSV
        function exportToCSV() {
            console.log('Export CSV demandé');
            
            // Fermer le menu
            document.getElementById('exportMenu').classList.remove('visible');
            
            const data = prepareExportData();
            
            // Créer le contenu CSV
            const headers = ['Famille', 'Nom', 'Description (EN)', 'Description (FR)', 'Catégorie de coût', 'Effort estimé'];
            let csvContent = headers.join(';') + '\n';
            
            data.forEach(row => {
                const values = [
                    row['Famille'],
                    row['Nom'],
                    row['Description (EN)'],
                    row['Description (FR)'],
                    row['Catégorie de coût'],
                    row['Effort estimé']
                ];
                
                // Échapper les guillemets et entourer les valeurs de guillemets si nécessaire
                const escapedValues = values.map(val => {
                    if (val === null || val === undefined) return '';
                    const str = String(val);
                    if (str.includes(';') || str.includes('"') || str.includes('\n')) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                });
                
                csvContent += escapedValues.join(';') + '\n';
            });
            
            // Créer un blob et télécharger
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const date = new Date().toISOString().split('T')[0];
            const filename = `Lexique_Taches_Media_Orders_${date}.csv`;
            
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            console.log('Export CSV terminé:', filename);
        }
    </script>
</body>
</html>
